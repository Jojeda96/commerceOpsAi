name: CommerceOps AI - CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/ml-service/requirements.txt
          pip install pytest pytest-cov

      - name: Validate Delivery Feature Contract V3
        run: |
          PYTHONPATH=. python scripts/contracts/validate_delivery_contract.py

      - name: Validate Feature Snapshots Schema
        run: |
          PYTHONPATH=. python scripts/ml/feature_snapshot_schema.py

      - name: Verify Model Quality Gate Baseline Status
        run: |
          PYTHONPATH=.:apps/ml-service python -c "from app.services.model_governance import evaluate_delivery_model; import json; m = json.load(open('data/models/delivery_delay_metrics.json')); res = evaluate_delivery_model(m); print('Gate Status:', res.status); assert res.status in ['EXPERIMENTAL_NOT_APPROVED', 'APPROVED_FOR_DEMO_INFERENCE']"

      - name: Run Python Unit & Parity Test Suite
        run: |
          PYTHONPATH=.:apps/ml-service python -m pytest tests/contracts tests/ml apps/ml-service/tests -v

  typescript-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run TypeScript Jest Tests
        run: npm run test
