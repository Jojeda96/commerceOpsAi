name: CI & Full-Stack Quality Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  ml-contract-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ML dependencies
        run: pip install -r apps/ml-service/requirements.txt pytest scikit-learn xgboost shap
      - name: Run ML unit tests (features, split, metrics)
        run: PYTHONPATH=. python -m pytest tests/ml -v
      - name: Run ML service API tests
        run: cd apps/ml-service && PYTHONPATH=. python -m pytest tests/ -v

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build --filter=api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build --filter=web

  docker-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure processed data directory exists
        run: mkdir -p data/processed data/models
      - name: Build and start Docker services
        run: docker compose up -d postgres redis ml-service
      - name: Verify service health and metrics endpoints
        run: |
          sleep 10
          docker ps
          curl --fail --retry 10 --retry-delay 3 http://localhost:8000/health
          curl --fail --retry 10 --retry-delay 3 http://localhost:8000/models/delivery-delay/metrics
