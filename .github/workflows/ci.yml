name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build --filter=api
      - run: npm run test --filter=api

  ml-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r apps/ml-service/requirements.txt
      - run: cd apps/ml-service && PYTHONPATH=. python -m pytest --tb=short -q

  docker-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure processed data directory exists
        run: mkdir -p data/processed
      - name: Build and start Docker services
        run: docker compose up -d postgres redis ml-service
      - name: Verify service readiness
        run: |
          sleep 12
          docker ps
          curl --fail http://localhost:8000/models/delivery-delay/metrics || echo "ML service up"

