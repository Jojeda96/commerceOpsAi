name: CommerceOps AI - CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/ml-service/requirements.txt
          pip install pytest pytest-cov

      - name: Validate Delivery Feature Contract V3
        run: |
          PYTHONPATH=.:apps/ml-service python scripts/contracts/validate_delivery_contract.py

      - name: Validate Feature Snapshots Schema
        run: |
          PYTHONPATH=.:apps/ml-service python scripts/ml/feature_snapshot_schema.py

      - name: Verify Model Quality Gate Baseline Status
        run: |
          PYTHONPATH=.:apps/ml-service python -c "from app.services.model_governance import evaluate_delivery_model; import json; m = json.load(open('data/models/delivery_delay_metrics.json')); res = evaluate_delivery_model(m); print('Gate Status:', res.status); assert res.status in ['EXPERIMENTAL_NOT_APPROVED', 'APPROVED_FOR_DEMO_INFERENCE']"

      - name: Run Python Unit & Parity Test Suite
        run: |
          PYTHONPATH=.:apps/ml-service python -m pytest tests/contracts tests/ml apps/ml-service/tests -v

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: commerce_ops_db
        ports:
          - 5434:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5434/commerce_ops_db?schema=public"
      SNAPSHOT_VERIFY_STRICT: "true"
      SNAPSHOT_EXPECTATION: "EMPTY_ALLOWED"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node Dependencies
        run: npm ci

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5434 -U postgres && exit 0
            sleep 2
          done
          exit 1

      - name: Run Database Migrations
        run: npm run db:migrate:deploy

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Seed Database Fixtures
        run: npm run db:seed:ci

      - name: Run Snapshot Readiness Diagnostics
        run: npm run snapshots:verify

      - name: Run Workspace Build
        run: npm run build

      - name: Run Linter
        run: npm run lint

      - name: Run TypeScript Unit & Integration Tests
        run: npm run test

      - name: Run E2E Quality Gates
        run: npm run test:e2e
